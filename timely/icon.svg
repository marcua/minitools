<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
    <!-- Background -->
    <rect fill="#FAFBFC" width="100" height="100" rx="22"/>
    <rect fill="none" stroke="#E1E4E8" stroke-width="2" x="1" y="1" width="98" height="98" rx="21"/>

    <!-- Clock face -->
    <circle fill="#FFFFFF" stroke="#4F46E5" stroke-width="5" cx="50" cy="54" r="28"/>

    <!-- Hands -->
    <line stroke="#4F46E5" stroke-width="5" stroke-linecap="round" x1="50" y1="54" x2="50" y2="36"/>
    <line stroke="#D97706" stroke-width="5" stroke-linecap="round" x1="50" y1="54" x2="64" y2="60"/>
    <circle fill="#1B2631" cx="50" cy="54" r="3.5"/>

    <!-- Crown -->
    <rect fill="#4F46E5" x="42" y="14" width="16" height="8" rx="4"/>
    <!-- Ascending tick marks -->
    <circle fill="#4F46E5" cx="32" cy="86" r="3"/>
    <circle fill="#8B8FF0" cx="50" cy="86" r="3"/>
    <circle fill="#C7C9F5" cx="68" cy="86" r="3"/>
</svg>
